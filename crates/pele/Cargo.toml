[package]
name = "pele-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic Mermaid flowcharts for Rust, Swift and WebAssembly"
include = ["src/**", "Cargo.toml", "README.md", "assets/**", "LICENSE", "NOTICE"]

[lib]
name = "pele"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rustybuzz = "=0.20.1"
ryu-js = "=1.0.2"
regex = "=1.13.1"

[dev-dependencies]
roxmltree = "0.21"
resvg = { version = "0.48", default-features = false }
