[package]
name = "pele-perf-consumer"
version = "0.1.0"
edition = "2021"
publish = false

# Independent consumer: does not modify the library workspace or production deps.
[workspace]

[dependencies]
pele = { package = "pele-rs", path = "../../../crates/pele" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "=0.10.7"

[[bin]]
name = "pele-perf"
path = "src/main.rs"

[[bin]]
name = "pele-perf-alloc"
path = "src/bin/alloc.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
